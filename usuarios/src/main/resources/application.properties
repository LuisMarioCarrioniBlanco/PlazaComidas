spring.application.name=usuarios
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plazoleta_usuarios}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8081}
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
bootstrap.admin.email=${ADMIN_EMAIL:}
bootstrap.admin.password=${ADMIN_PASSWORD:}
bootstrap.admin.name=${ADMIN_NAME:}
bootstrap.admin.last-name=${ADMIN_LAST_NAME:}
bootstrap.admin.document=${ADMIN_DOCUMENT:}
bootstrap.admin.phone=${ADMIN_PHONE:}
services.plazoleta.url=${PLAZOLETA_URL:http://localhost:8082}
springdoc.swagger-ui.path=/swagger-ui.html
